<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="心動小鎮：小小理財家——給小學生的生活理財投資互動遊戲">
  <title>心動小鎮｜小小理財家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="心動小鎮小小理財家遊戲">
    <header class="hud">
      <div class="brand"><span class="brand-mark">✦</span><span>心動小鎮</span><small>小小理財家</small></div>
      <div class="progress"><span id="levelText">第 1 關｜市集小管家</span><span class="progress-track"><i id="progressBar"></i></span></div>
      <div class="stats"><span>得分 <b id="scoreText">0</b></span><span>KEY <b id="keyText">0 / 2</b></span></div>
    </header>

    <section class="play-area">
      <canvas id="scene" aria-label="心動小鎮遊戲場景"></canvas>
      <div class="scene-badge">晴天・河畔市集</div>
      <div id="hint" class="hint" role="status">使用 WASD／方向鍵移動，走近紅色理財站按 E</div>
      <div class="touch-controls" aria-label="觸控移動控制">
        <button data-key="up" aria-label="向上">▲</button>
        <div><button data-key="left" aria-label="向左">◀</button><button data-key="down" aria-label="向下">▼</button><button data-key="right" aria-label="向右">▶</button></div>
      </div>
      <button id="interact" class="interact" hidden>按 E 互動</button>
    </section>

    <section id="questionCard" class="question-card" hidden aria-live="polite">
      <div class="card-top"><span id="questionKicker">理財互動站</span><button id="closeQuestion" class="icon-btn" aria-label="關閉題目">×</button></div>
      <h1 id="questionTitle">市集小管家</h1>
      <p id="questionPrompt"></p>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback"></p>
    </section>

    <section id="resultCard" class="result-card" hidden>
      <div class="result-icon">🏆</div>
      <p class="eyebrow">任務完成</p>
      <h1>你是小小理財家！</h1>
      <div class="result-score"><span id="finalScore">0</span><small>/ 100 分</small></div>
      <p id="resultMessage"></p>
      <div class="learned"><span>✓ 會計算支出與剩餘金額</span><span>✓ 會先保留需要的資金</span><span>✓ 會辨識投資風險</span></div>
      <button id="restart" class="primary">再玩一次</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
